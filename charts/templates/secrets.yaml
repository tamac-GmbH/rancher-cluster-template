{{- if eq .Values.cloudprovider "harvester" }}
apiVersion: v1
data:
  credential: {{ .Values.harvester.harvesterCredential }}
kind: Secret
metadata:
  name: harvester-config-clusters-{{ .Values.cluster.name }}
  namespace: fleet-default
  annotations:
    v2prov-authorized-secret-deletes-on-cluster-removal: 'true'
    v2prov-secret-authorized-for-cluster: {{ .Values.cluster.name }}
type: secret
{{- end }}